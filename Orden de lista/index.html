<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenar Arrays de Cadenas</title>
    <link rel="stylesheet" href="styles.css">


</head>
<body>

    <h1>Ordenar Arrays de Cadenas</h1>
    <hr>
    <p>Ingrese nombres en la caja de texto de abajo y ordene este listado el cual apareceran en el área de texto.</p>

    
    <!-- Poner nombres -->
        <div class="fila">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre">
            <button id="botonAgregar">Agregar y ordenar nombre</button>
        </div>

    <!-- Mostrar nombres ordenados -->
    <h2>Nombres ordenados</h2>
    <hr>

    <div class="fila">
        <textarea id="listaNombres" placeholder="Aqui apareceran lo nombres ordenados" readonly></textarea>
        <button id="botonLimpiar">Limpiar</button>
    </div>

<script src="script.js"></script>
</body>
</html>
